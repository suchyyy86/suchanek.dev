<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <!-- Zdroj náhledového obrázku public/og.png (1200×630). Texty = titulek z CV. -->
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-ext-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }

      * { box-sizing: border-box; margin: 0; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 76px 84px 72px;
        background:
          radial-gradient(circle at 88% 115%, rgb(255 106 69 / 0.2), transparent 52%),
          radial-gradient(circle at 10% -20%, rgb(255 255 255 / 0.05), transparent 45%),
          #0a0a0a;
        color: #ededed;
        font-family: 'Instrument Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at 70% 50%, black, transparent 75%);
      }

      .domain {
        position: relative;
        font-family: 'Geist Mono', monospace;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #a3a3a3;
      }

      .dot { color: #ff6a45; }

      .name {
        position: relative;
        font-size: 116px;
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: -0.055em;
      }

      .role {
        position: relative;
        margin-top: 28px;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: -0.015em;
        color: #a3a3a3;
      }

      .sep { color: #5c5c5c; margin: 0 0.25em; }
    </style>
  </head>
  <body>
    <div class="domain">suchanek<span class="dot">.</span>dev</div>
    <div>
      <div class="name">Mariusz Suchanek<span class="dot">.</span></div>
      <div class="role">Vývojář webových aplikací<span class="sep">|</span>Juniorní projektový manažer</div>
    </div>
  </body>
</html>
