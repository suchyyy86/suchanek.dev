<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Zdroj ikon. ?square = plné čtvercové pozadí pro apple-touch-icon (iOS si rohy zakulatí sám). -->
    <style>
      * { margin: 0; }
      html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
      svg { display: block; width: 512px; height: 512px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect id="bg" width="32" height="32" rx="8" fill="#111" />
      <text x="16" y="22" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="700" fill="#fff">s<tspan fill="#ff5a36">.</tspan></text>
    </svg>
    <script>
      if (location.search.includes('square')) document.getElementById('bg').setAttribute('rx', '0');
    </script>
  </body>
</html>
